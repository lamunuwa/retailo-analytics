name: CI

on:
  push:
    branches:
      - "main"
      - "dev"
      - "feature/**"
  pull_request:
    branches:
      - "main"
      - "dev"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: pip install -r app/requirements.txt pytest pytest-cov httpx ruff mypy

      - name: Run Ruff
        run: ruff check app/src tests vision/src

      - name: Run Mypy
        run: mypy app/src tests vision/src

      - name: Run Pytest
        run: pytest --cov=app --cov-fail-under=80
