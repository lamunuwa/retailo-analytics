name: API CI

on:
  push:
    branches:
      - "main"
      - "dev"
      - "feature/**"
      - fix/**
    paths:
      - "app/**"
      - "tests/api/**"
      - "pyproject.toml"
      - ".github/workflows/api.yml"
  pull_request:
    branches:
      - "main"
      - "dev"
    paths:
      - "app/**"
      - "tests/api/**"
      - "pyproject.toml"
      - ".github/workflows/api.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: pip install -r app/requirements.txt pytest pytest-cov ruff mypy

      - name: Run Ruff
        run: ruff check app/src tests/api

      - name: Run Mypy
        run: mypy app/src tests/api

      - name: Run Pytest
        run: pytest -o addopts="" tests/api --cov=app/src --cov-fail-under=80
