[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["app/src", "tests", "vision/src"]
explicit_package_bases = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests/api", "tests/vision"]
pythonpath = ["app", "."]
addopts = "--cov=app/src --cov=vision/src --cov-fail-under=80"

[tool.coverage.run]
omit = [
    "app/src/main.py",
    "app/src/core/*",
]
