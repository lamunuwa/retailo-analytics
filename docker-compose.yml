services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pydata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  vision:
    profiles: ["edge"]
    build:
      context: .
      dockerfile: vision/Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8000}
      API_TOKEN: ${API_TOKEN:-}
      CAMERA_SOURCE: ${CAMERA_SOURCE:-}
      DEVICE_ID: ${DEVICE_ID:-}
      MODEL_PATH: ${MODEL_PATH:-/models/yolo11n.pt}
    volumes:
      - vision_models:/models
    restart: unless-stopped

volumes:
  pydata:
  vision_models:
