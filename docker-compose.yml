services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pydata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-7}
      SEED_DEMO_USER: ${SEED_DEMO_USER:-true}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-Retailo Dev}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-dev@retailo.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-retailo123}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      PORT: 80
      API_SCHEME: http
      API_HOST: api:8000
    depends_on:
      - api
    restart: unless-stopped

  vision:
    profiles: ["edge"]
    build:
      context: .
      dockerfile: vision/Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      API_TOKEN: ${API_TOKEN:-}
      DEMO_VIDEO_PATH: ${DEMO_VIDEO_PATH:-vision/data/demo/supermarket.mp4}
      CAMERA_ID: ${CAMERA_ID:-1}
      MODEL_PATH: ${MODEL_PATH:-yolov8n.pt}
    volumes:
      - vision_models:/models
      - ./vision/data/demo:/app/vision/data/demo:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pydata:
  vision_models:
